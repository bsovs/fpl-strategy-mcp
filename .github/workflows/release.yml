name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            artifact: fpl-strategy-mcp-macos-x64
          - os: macos-14
            artifact: fpl-strategy-mcp-macos-arm64
          - os: windows-latest
            artifact: fpl-strategy-mcp-windows-x64
          - os: ubuntu-22.04
            artifact: fpl-strategy-mcp-linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,remote]"
      - name: Build one-file executable
        shell: bash
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            data_separator=";"
            executable_suffix=".exe"
          else
            data_separator=":"
            executable_suffix=""
          fi
          python -m PyInstaller --clean --noconfirm --onefile \
            --name "$ARTIFACT" \
            --paths src \
            --add-data "assets${data_separator}assets" \
            --hidden-import fpl_strategy_mcp.http_server \
            --collect-all mcp \
            --collect-all starlette \
            --collect-all uvicorn \
            scripts/build_entry.py
          mkdir -p release
          cp "dist/${ARTIFACT}${executable_suffix}" "release/${ARTIFACT}${executable_suffix}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum fpl-strategy-mcp-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
